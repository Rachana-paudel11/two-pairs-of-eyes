<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Two Pairs of Eyes — Interactive warehouse health &amp; safety training simulation" />
    <title>Two Pairs of Eyes | H&amp;S Training</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/ui/styles/main.css" />
    <link rel="stylesheet" href="/src/ui/styles/login.css" />
    <script>
      try {
        if (sessionStorage.getItem('technova_safety_session_checkpoint')) {
          document.documentElement.classList.add('has-active-session');
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <!-- Login Screen overlay -->
    <div id="login-screen" class="login-overlay">
      <!-- Top Left Platform Badge -->
      <div class="login-top-badge">
        <span class="pulse-dot"></span>
        <span>3D SIMULATION PLATFORM</span>
      </div>

      <!-- Top Right TechNova Logo & Admin Portal Link -->
      <div class="login-top-logo">
        <a href="/admin.html" class="top-admin-badge" title="Access System Administrator Portal">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <span>Admin Portal ↗</span>
        </a>
        <img src="/technova-logo-white.svg" alt="TechNova" class="technova-logo-img" />
      </div>

      <!-- Centered Main Wrapper -->
      <div class="login-center-wrapper">
        <!-- Title & Subtitle above card -->
        <div class="login-brand-header">
          <h1 class="brand-title">Two Pairs of <span class="hero-highlight">Eyes</span></h1>
          <p class="brand-subtitle">Interactive warehouse safety training for a safer tomorrow.</p>
        </div>

        <!-- The Centered Form Card -->
        <div class="login-panel">
          <!-- Clean Underline Tabs -->
          <div class="login-tabs">
            <button type="button" class="login-tab active" id="tab-login">Sign In</button>
            <button type="button" class="login-tab" id="tab-register">Register</button>
          </div>

          <form id="login-form" data-mode="login" autocomplete="off">
            <!-- Trainee ID -->
            <div class="input-group" id="traineeIdGroup">
              <div class="input-label-row">
                <label for="traineeId">
                  <span id="traineeIdLabel">Trainee ID</span>
                </label>
                <div id="default-creds-box" class="demo-inline-badge">
                  <button type="button" class="demo-fill-btn" id="fill-default-creds" onclick="var t=document.getElementById('traineeId');var p=document.getElementById('password');if(t)t.value='TR-10001';if(p)p.value='password123';" title="Click to auto-fill default credentials">
                    <span class="demo-star">★</span>
                    <span>Demo ID: TR-10001</span>
                    <svg class="copy-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                  </button>
                </div>
              </div>
              <div class="input-wrapper">
                <svg class="input-leading-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <input type="text" id="traineeId" placeholder="TR-10001" autocomplete="off" data-lpignore="true" />
              </div>
            </div>

            <!-- Player Name (Register Mode) -->
            <div class="input-group" id="playerNameGroup" hidden>
              <label for="playerName">
                <span>Player Name</span>
              </label>
              <div class="input-wrapper">
                <svg class="input-leading-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <input type="text" id="playerName" placeholder="e.g. Alex" autocomplete="off" data-lpignore="true" />
              </div>
            </div>

            <!-- Password -->
            <div class="input-group" id="passwordGroup">
              <label for="password">
                <span>Password</span>
              </label>
              <div class="input-wrapper password-wrapper">
                <svg class="input-leading-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <input type="password" id="password" required placeholder="Enter your password" autocomplete="new-password" data-lpignore="true" />
                <button type="button" class="password-toggle-btn" id="toggle-password" title="Show or hide password" aria-label="Toggle password visibility">
                  <svg class="eye-open" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                  <svg class="eye-closed" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Confirm Password (Register Mode) -->
            <div class="input-group" id="confirmPasswordGroup" hidden>
              <label for="confirmPassword">
                <span>Confirm Password</span>
              </label>
              <div class="input-wrapper password-wrapper">
                <svg class="input-leading-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <input type="password" id="confirmPassword" placeholder="Re-enter password" autocomplete="new-password" data-lpignore="true" />
                <button type="button" class="password-toggle-btn" id="toggle-confirm-password" title="Show or hide confirm password" aria-label="Toggle confirm password visibility">
                  <svg class="eye-open" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                  <svg class="eye-closed" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Options Row -->
            <div class="login-options">
              <label class="remember-me" for="rememberMe">
                <input type="checkbox" id="rememberMe" checked>
                <span>Remember me</span>
              </label>
              <a href="#" class="forgot-password" id="forgot-password-link">Supervisor help</a>
            </div>

            <!-- Primary Submit Action -->
            <div class="login-actions">
              <button type="submit" class="login-btn">
                <span>Sign In</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                  <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
              </button>
            </div>

            <!-- Clean Subtle Divider -->
            <div class="auth-divider">
              <span>or</span>
            </div>

            <!-- Instant Guest Demo Access -->
            <div class="guest-access-container">
              <button type="button" class="guest-btn" id="guest-login-btn">
                <svg class="guest-play-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"></circle>
                  <polygon points="10 8 16 12 10 16 10 8" fill="currentColor"></polygon>
                </svg>
                <span>Continue as Guest Trainee</span>
                <svg class="guest-arrow" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
              </button>
            </div>

            <div id="login-error" class="login-error" hidden></div>

            <!-- Minimal Clean Footer: Mode switch & Admin Access -->
            <div class="login-card-footer">
              <div class="auth-mode-switch">
                <span class="switch-prompt">Need a new trainee ID?</span>
                <button type="button" class="create-account-btn" id="toggle-mode">Register Account</button>
              </div>
              <div class="admin-portal-access">
                <a href="/admin.html" class="admin-access-link" title="System Administrator Management Portal">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                  </svg>
                  <span>Administrator Sign In ↗</span>
                </a>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Three.js renders into this canvas -->
    <canvas id="app"></canvas>

    <!-- Floating 3D Character Overhead Role Badges -->
    <div id="character-nameplates" aria-hidden="true">
      <div id="nameplate-alex" class="char-nameplate nameplate-trainee" style="opacity: 0;">
        <span class="nameplate-pulse"></span>
        <span class="nameplate-role-tag">YOU (TRAINEE)</span>
        <span class="nameplate-name">Alex</span>
      </div>
      <div id="nameplate-dave" class="char-nameplate nameplate-supervisor" style="opacity: 0;">
        <span class="nameplate-icon">🛡️</span>
        <span class="nameplate-role-tag">SUPERVISOR</span>
        <span class="nameplate-name">Dave</span>
      </div>
    </div>

    <!-- HUD overlay: always on top of the canvas -->
    <div id="hud" aria-live="polite"></div>

    <!-- Dialogue panel: Dave speaks here -->
    <div id="dialogue-panel" class="panel" aria-live="polite" hidden></div>

    <!-- Action menu: cordon / report / ignore buttons -->
    <div id="action-menu" class="panel" hidden></div>

    <!-- Debrief screen: shown on session complete -->
    <div id="debrief" hidden></div>

    <!-- Toast / consequence notification -->
    <div id="toast" aria-live="assertive" hidden></div>

    <!-- Centre-screen safety flag impact -->
    <div id="flag-alert" aria-live="assertive" hidden></div>

    <!-- Persistent flag counter: opens "why you were flagged" -->
    <div id="flag-log" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
