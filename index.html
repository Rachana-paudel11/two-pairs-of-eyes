<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Two Pairs of Eyes — Interactive warehouse health &amp; safety training simulation" />
    <title>Two Pairs of Eyes | H&amp;S Training</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/ui/styles/main.css" />
    <link rel="stylesheet" href="/src/ui/styles/login.css" />
  </head>
  <body>
    <!-- Login Screen overlay -->
    <div id="login-screen" class="login-overlay">
      <div class="login-split-container">
        <!-- Left Side (Hero) -->
        <div class="login-hero">
          <div class="login-logo">
            <img src="/technova-logo.png" alt="TechNova Logo" class="technova-logo-img" />
          </div>
          <div class="login-hero-content">
            <h1 class="hero-title">Safer People.<br><span class="hero-highlight">Smarter Warehouses.</span></h1>
            <p class="hero-subtitle">Learn. Practice. Stay Safe.</p>
            
            <ul class="hero-features">
              <li>
                <span class="feature-icon">🛡️</span>
                <span class="feature-text">Realistic<br>Scenarios</span>
              </li>
              <li>
                <span class="feature-icon">🔗</span>
                <span class="feature-text">Build<br>Awareness</span>
              </li>
              <li>
                <span class="feature-icon">📊</span>
                <span class="feature-text">Improve<br>Safety</span>
              </li>
            </ul>
          </div>
          <div class="hero-footer">A safer tomorrow<br>starts with better training.</div>
        </div>

        <!-- Right Side (Form) -->
        <div class="login-form-container">
          <div class="login-panel panel">
            <!-- Tabs -->
            <div class="login-tabs">
              <button class="login-tab active" id="tab-login">Login</button>
              <button class="login-tab" id="tab-register">Sign Up</button>
            </div>

            <div class="login-header left-align">
              <h2 class="login-title">Welcome <span class="hero-highlight">Back</span></h2>
              <p class="login-subtitle">Sign in to continue your warehouse safety training.</p>
            </div>

            <form id="login-form" data-mode="login" autocomplete="off">
              <div class="input-group" id="traineeIdGroup">
                <label for="traineeId">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                  TRAINEE ID
                </label>
                <input type="text" id="traineeId" placeholder="Enter your trainee ID" autocomplete="off" data-lpignore="true" />
              </div>
              <div class="input-group" id="playerNameGroup" hidden>
                <label for="playerName">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                  PLAYER NAME
                </label>
                <input type="text" id="playerName" placeholder="e.g. Alex" autocomplete="off" data-lpignore="true" />
              </div>
              <div class="input-group">
                <label for="password">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                  PASSWORD
                </label>
                <div class="password-wrapper">
                  <input type="password" id="password" required placeholder="Enter your password" autocomplete="new-password" data-lpignore="true" />
                </div>
              </div>

              <div class="login-options">
                <label class="remember-me">
                  <input type="checkbox" checked>
                  Remember me
                </label>
                <a href="#" class="forgot-password">Forgot password?</a>
              </div>

              <div class="login-actions">
                <button type="submit" class="continue-pill-btn login-btn">➔ Login</button>
              </div>
              
              <div class="divider"><span>OR</span></div>
              
              <button type="button" class="create-account-btn" id="toggle-mode">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                Create New Account
              </button>

              <div id="login-error" class="login-error" hidden></div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Three.js renders into this canvas -->
    <canvas id="app"></canvas>

    <!-- HUD overlay: always on top of the canvas -->
    <div id="hud" aria-live="polite"></div>

    <!-- Dialogue panel: Dave speaks here -->
    <div id="dialogue-panel" class="panel" aria-live="polite" hidden></div>

    <!-- Action menu: cordon / report / ignore buttons -->
    <div id="action-menu" class="panel" hidden></div>

    <!-- Debrief screen: shown on session complete -->
    <div id="debrief" hidden></div>

    <!-- Toast / consequence notification -->
    <div id="toast" aria-live="assertive" hidden></div>

    <!-- Centre-screen safety flag impact -->
    <div id="flag-alert" aria-live="assertive" hidden></div>

    <!-- Persistent flag counter: opens "why you were flagged" -->
    <div id="flag-log" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
