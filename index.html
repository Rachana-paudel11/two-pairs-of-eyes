<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Two Pairs of Eyes — Interactive warehouse health &amp; safety training simulation" />
    <title>Two Pairs of Eyes | H&amp;S Training</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/ui/styles/main.css" />
  </head>
  <body>
    <!-- Three.js renders into this canvas -->
    <canvas id="app"></canvas>

    <!-- HUD overlay: always on top of the canvas -->
    <div id="hud" aria-live="polite"></div>

    <!-- Dialogue panel: Dave speaks here -->
    <div id="dialogue-panel" class="panel" aria-live="polite" hidden></div>

    <!-- Action menu: cordon / report / ignore buttons -->
    <div id="action-menu" class="panel" hidden></div>

    <!-- Debrief screen: shown on session complete -->
    <div id="debrief" hidden></div>

    <!-- Toast / consequence notification -->
    <div id="toast" aria-live="assertive" hidden></div>

    <!-- Centre-screen safety flag impact -->
    <div id="flag-alert" aria-live="assertive" hidden></div>

    <!-- Persistent flag counter: opens "why you were flagged" -->
    <div id="flag-log" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
