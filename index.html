<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Two Pair of Eyes – Warehouse Safety Training</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
  <link rel="stylesheet" href="src/styles/main.css">
</head>
<body>
  <a-scene renderer="antialias: true; colorManagement: true">
    <a-assets timeout="30000">
      <a-asset-item id="warehouse-model" src="public/assets/models/environment/warehouse.glb"></a-asset-item>
      <a-asset-item id="oil-spill-model" src="public/assets/models/environment/oil_spill_container.glb"></a-asset-item>
      <a-asset-item id="wet-floor-model" src="public/assets/models/environment/psx_wet_floor_sign.glb"></a-asset-item>
      <a-asset-item id="box-model" src="public/assets/models/environment/cardboard_box.glb"></a-asset-item>
      <a-asset-item id="broken-pallet-model" src="public/assets/models/environment/broken_pallet.glb"></a-asset-item>
      <a-asset-item id="shelf-model" src="public/assets/models/environment/worn_warehouse_shelf.glb"></a-asset-item>
      <a-asset-item id="rack2-model" src="public/assets/models/environment/metal_rack_shelf_2k_textures.glb"></a-asset-item>
      <a-asset-item id="charger-model" src="public/assets/models/environment/battery_charger.glb"></a-asset-item>
      <a-asset-item id="pallet-racking-model" src="public/assets/models/environment/pallet_racking.glb"></a-asset-item>
    </a-assets>

    <a-entity id="scene-content"></a-entity>
  </a-scene>

  <div id="ui-overlay"></div>

  <!-- src/engine/stopsValidator.js imports the "ajv" npm dependency by bare
       specifier, which only Node resolves. This import map lets the browser
       resolve the same dependency (pinned to the installed version) from a
       CDN, without adding a bundler or a new dependency. -->
  <script type="importmap">
    { "imports": { "ajv": "https://esm.sh/ajv@8.20.0" } }
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
